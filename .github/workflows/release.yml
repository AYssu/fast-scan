name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的正式版标签，例如 v3.0.2（必须与清单版本一致）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release files and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Test packager
        run: python3 -m unittest discover -s tests -v
      - name: Validate version and package
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$(python3 -c 'import json; print("v" + json.load(open("releases/current.json"))["version"])')"
          fi
          python3 scripts/package_release.py --tag "$RELEASE_TAG"
          cd build/release
          sha256sum -c SHA256SUMS

  publish:
    name: Publish stable GitHub Release
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Prepare verified release assets
        run: |
          python3 scripts/package_release.py --tag "$RELEASE_TAG"
          cd build/release
          sha256sum -c SHA256SUMS
      # Use the publisher from this workflow revision, including when dispatching
      # an older release tag that predates the idempotent publisher.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Publish release or verify identical existing assets
        run: python3 release-tools/scripts/publish_release.py --tag "$RELEASE_TAG" --assets build/release
